name: Build NuraOS LCD Edition (Zero GUI)
on:
  push:
  workflow_dispatch:

env:
  KERNEL_BRANCH: 6.12.1

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build configurations
        uses: actions/checkout@v4

      - name: Substitute placeholders in configs
        run: |
          find . -type f -name "*.cfg" -exec sed -i "s|HOME|$(echo $HOME)|;s|NPROC|$(nproc)|" {} +

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/.local/var/pmbootstrap/cache_ccache
          key: ccache-alioth-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            ccache-alioth-${{ github.ref }}-
            ccache-alioth-

      - name: Install pmbootstrap & ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          pmbootstrap --version
          ccache --version

      - name: Set up pmaports
        run: |
          echo -e '\n\n' | pmbootstrap init || true
          cd ~/.local/var/pmbootstrap/cache_git/pmaports
          git remote get-url github 2>/dev/null || \
          git remote add github https://github.com/Ayushskull7/pmaports-alioth-new
          git fetch github main
          git checkout github/main -- device-xiaomi-alioth/
          git checkout github/main -- firmware-xiaomi-alioth/
          git checkout github/main -- linux-postmarketos-qcom-sm8250-alioth/
          mv device-xiaomi-alioth device/testing/
          mv firmware-xiaomi-alioth device/testing/
          mv linux-postmarketos-qcom-sm8250-alioth device/testing/

          git status

      - name: Clone kernel sources
        run: |
          git clone https://github.com/mainlining/linux.git --single-branch --branch nikroks/alioth --depth 1 ./linux

      - name: Apply Aftermarket LCD Touchscreen Patch
        run: |
          python3 apply_lcd_patch.py
          git -C linux diff drivers/input/touchscreen/ft8756.c arch/arm64/boot/dts/qcom/sm8250-xiaomi-alioth.dts

      - name: Configure pmbootstrap
        run: |
          cp xiaomi-alioth.cfg ~/.config/pmbootstrap_v3.cfg

      - name: Compile kernel with envkernel
        run: |
          cd linux
          cp ../alioth_defconfig arch/arm64/configs
          shopt -s expand_aliases
          source ../pmbootstrap/helpers/envkernel.sh
          make alioth_defconfig
          echo "===== VERIFYING CRITICAL KERNEL OPTIONS ====="
          CONFIG=.output/.config
          
          grep -E "CONFIG_ARM64_VA_BITS=48" $CONFIG
          grep -E "CONFIG_PGTABLE_LEVELS=4" $CONFIG
          
          grep -E "^# CONFIG_EFI_ZBOOT is not set" $CONFIG
          
          grep -E "CONFIG_USB=y" $CONFIG
          grep -E "CONFIG_USB_DWC3=y" $CONFIG
          grep -E "CONFIG_USB_DWC3_QCOM=y" $CONFIG
          grep -E "CONFIG_USB_STORAGE=y" $CONFIG
          grep -E "CONFIG_USB_UAS=y" $CONFIG
          grep -E "CONFIG_USB_ROLE_SWITCH=y" $CONFIG
          
          grep -E "CONFIG_SCSI=y" $CONFIG
          grep -E "CONFIG_BLK_DEV_SD=y" $CONFIG
          
          grep -E "CONFIG_NTFS3_FS=y" $CONFIG
          grep -E "CONFIG_VFAT_FS=y" $CONFIG
          grep -E "CONFIG_FAT_FS=y" $CONFIG
          
          echo "===== KERNEL CONFIG VERIFICATION DONE ====="
          make -j$(nproc)
          pmbootstrap build --envkernel linux-postmarketos-qcom-sm8250-alioth
          ccache -s

      - name: Build rootfs (Zero GUI)
        run: |
          cp xiaomi-alioth.cfg ~/.config/pmbootstrap_v3.cfg
          pmbootstrap install --password 1

          # Export flashable images
          pmbootstrap export
          mkdir out
          cp /tmp/postmarketOS-export/boot.img out/boot-xiaomi-alioth-lcd.img
          cp /tmp/postmarketOS-export/xiaomi-alioth.img out/rootfs-xiaomi-alioth-lcd.img

      - name: Compress images for release
        run: |
          cd out
          xz -8 -T0 -k boot-xiaomi-alioth-lcd.img
          xz -8 -T0 -k rootfs-xiaomi-alioth-lcd.img
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuraos-alioth-lcd-zero-gui
          path: out/*-alioth-lcd.img*
          retention-days: 90

      - name: Generate Release Metadata
        id: meta
        run: |
          echo "tag=v1.0.0-lcd-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "title=NuraOS Alioth LCD Edition (Zero GUI) - $(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            out/boot-xiaomi-alioth-lcd.img.xz
            out/rootfs-xiaomi-alioth-lcd.img.xz
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            ## NuraOS for POCO F3 / Redmi K40 / Mi 11X (Aftermarket LCD Edition)
            
            ### Highlights:
            * **Fixed Touchscreen:** Integrated patch for replacement LCD FT8756 digitizer (chip ID 0x5252 and disabled CRC packet drop).
            * **Calibrated Touch Bounds:** DTB scaled to full 1080x2400 panel resolution.
            * **Zero GUI (Headless / Minimal):** Pure terminal environment ready for custom desktop or home server repurposing.
            * **Fast Minimal Kernel:** DWARF debug bloat, TV tuners, foreign display bridges, and unused drivers stripped out.
            * **Accelerated Builds:** ccache integration enabled.
            * **Default Credentials:** User `user`, Password `1`.
            
            ### Flash Instructions:
            ```bash
            unxz boot-xiaomi-alioth-lcd.img.xz
            unxz rootfs-xiaomi-alioth-lcd.img.xz
            fastboot flash boot_b boot-xiaomi-alioth-lcd.img
            fastboot flash userdata rootfs-xiaomi-alioth-lcd.img
            fastboot reboot
            ```
          draft: false
          prerelease: false
